services:
  # ---------------------------------------------------------------------------
  # Database & Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: infrastructure/postgress/Dockerfile
    container_name: fastapi_nuxt_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-postgres_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    build:
      context: .
      dockerfile: infrastructure/redis/Dockerfile
    container_name: fastapi_nuxt_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    container_name: fastapi_nuxt_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: infrastructure/fastapi/Dockerfile
    container_name: fastapi_nuxt_backend
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:-changeme}
      BACKEND_ALLOWED_ORIGINS: ${BACKEND_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # Prevent __pycache__ from being written to bind-mounted migrations directory
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Sync migrations with host so newly generated revisions persist
      - ./backend/fastapi/migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infrastructure/nuxt4/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${API_BASE_URL:-http://localhost:8000}
    container_name: fastapi_nuxt_frontend
    environment:
      NUXT_PUBLIC_API_BASE: ${API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - frontend

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    container_name: fastapi_nuxt_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - backend
      - frontend
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

# ---------------------------------------------------------------------------
# Volumes & Networks
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge