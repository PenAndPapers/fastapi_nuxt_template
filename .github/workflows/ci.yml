name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-checks:
    name: Backend CI (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Backend Dependencies
        run: uv sync --project backend/fastapi/

      - name: Audit Python Dependencies
        run: uv audit --directory backend/fastapi/

      - name: Run Ruff (Linter)
        run: uv run --project backend/fastapi/ ruff check backend/fastapi/

      - name: Run Ruff (Formatter Check)
        run: uv run --project backend/fastapi/ ruff format --check backend/fastapi/

      - name: Run Pytest
        run: uv run --project backend/fastapi/ pytest backend/fastapi/tests/

  frontend-checks:
    name: Frontend CI (Nuxt/Vue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "frontend/nuxt4/pnpm-lock.yaml"

      - name: Install Frontend Dependencies
        run: pnpm --prefix frontend/nuxt4 install

      # --- Add Audit Step Here ---
      - name: Audit Frontend Dependencies
        run: pnpm --prefix frontend/nuxt4 audit --audit-level high

      - name: Run Type Check & Build
        run: |
          pnpm --prefix frontend/nuxt4 run typecheck || true
          pnpm --prefix frontend/nuxt4 run build

  docker-security-check:
    name: Docker Security & Lint Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scan Dockerfiles for Vulnerabilities & Misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './infrastructure'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
